{% extends 'lectures/base.html' %}
{% block title %}{{ lecture.title }} - Lecture Site{% endblock %}

{% block content %}

<a href="javascript:history.back()" class="btn btn-outline-secondary mb-4">
    ← Back
</a>

<div class="card shadow-sm">

    <div class="card-body">

        <h1 class="card-title mb-3">
            {{ lecture.title }}
        </h1>

        <p class="card-text text-muted">
            {{ lecture.description }}
        </p>

        <div class="ratio ratio-16x9 mt-4">
            <iframe
                src="{{ lecture.youtube_url|cut:'watch?v='|add:'embed/' }}"
                title="{{ lecture.title }}"
                allowfullscreen>
            </iframe>
        </div>

    </div>

</div>

{% endblock %}
